name: crate-tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - gap-schema-profile-v13
          - gap-closed-wall-deny
          - gap-proof-live-bundle-mode
          - gap-snapshot-hygiene
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-test
        run: cargo test -p ${{ matrix.crate }}
